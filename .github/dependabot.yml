# Atualizações propostas por PR, uma vez por semana. Versão maior (Angular, .NET, TypeScript) fica
# de fora: muda o produto e entra por fase do plano, não por PR automático.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # O Roslyn 5.12 exige o MSBuild 18.7, que só vem nos SDKs 10.0.3xx em diante: subir o Roslyn sobe o
      # SDK mínimo de quem instala o Rastro. Entra por fase do plano, com aviso de SDK antigo na tela.
      - dependency-name: "Microsoft.CodeAnalysis*"
        update-types: ["version-update:semver-minor"]
    # Os pacotes do .NET (ASP.NET Core, EF Core, Extensions) saem juntos a cada patch e dependem uns
    # dos outros: subir um sozinho dá NU1605 (downgrade detectado) com TreatWarningsAsErrors.
    groups:
      dotnet:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
      # Os pacotes do Roslyn exigem a mesma versão do Workspaces.Common: um sozinho dá NU1107.
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # A versão do zone.js acompanha a do Angular (o Angular 20 exige ~0.15): sobe junto com ele.
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-minor"]
    groups:
      angular:
        patterns:
          - "@angular/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
