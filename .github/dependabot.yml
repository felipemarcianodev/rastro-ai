# Atualizações propostas por PR, uma vez por semana. Versão maior (Angular, .NET, TypeScript) fica
# de fora: muda o produto e entra por fase do plano, não por PR automático.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Os pacotes do .NET (ASP.NET Core, EF Core, Extensions) saem juntos a cada patch e dependem uns
    # dos outros: subir um sozinho dá NU1605 (downgrade detectado) com TreatWarningsAsErrors.
    groups:
      dotnet:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # A versão do zone.js acompanha a do Angular (o Angular 20 exige ~0.15): sobe junto com ele.
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-minor"]
    groups:
      angular:
        patterns:
          - "@angular/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
