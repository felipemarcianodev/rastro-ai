<a class="skip-link" href="#conteudo" (click)="skipToContent($event, content)">Ir para o conteúdo</a>

<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Rastro AI, ir para os levantamentos">
    <svg class="brand-mark" viewBox="0 0 28 20" aria-hidden="true">
      <path d="M2 16 C 8 16, 8 4, 14 4 S 20 16, 26 16" />
      <circle cx="2" cy="16" r="2" />
      <circle cx="26" cy="16" r="2.5" />
    </svg>
    <span class="brand-name">{{ title }}</span>
  </a>

  <nav class="nav" aria-label="Principal">
    <a class="nav-link" routerLink="/" [class.is-current]="area() === Area.Surveys" [attr.aria-current]="area() === Area.Surveys ? 'page' : null">Levantamentos</a>
    <a class="nav-link" [routerLink]="bancoTarget().commands" [fragment]="bancoTarget().fragment" [attr.aria-label]="bancoLabel()" [class.is-current]="area() === Area.Database" [attr.aria-current]="area() === Area.Database ? 'page' : null">Banco</a>
    <a class="nav-link" routerLink="/configuracoes" [class.is-current]="area() === Area.Settings" [attr.aria-current]="area() === Area.Settings ? 'page' : null">Configurações</a>
  </nav>

  <a class="ai-state" routerLink="/configuracoes" [fragment]="aiFragment" [class.is-on]="ai.active()" title="Configuração da IA e do modo agente">
    {{ ai.label() }}
  </a>
</header>

<main #content id="conteudo" class="main" tabindex="-1">
  <router-outlet />
</main>
