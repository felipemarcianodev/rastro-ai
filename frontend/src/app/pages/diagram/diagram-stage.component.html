<div #viewport class="stage-viewport" [class.is-dragging]="dragging()" tabindex="0" role="group"
  [attr.aria-label]="labelText()" aria-describedby="stage-keys-help"
  (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp($event)" (pointercancel)="onPointerCancel()"
  (wheel)="onWheel($event)" (keydown)="onKeydown($event)" (focusin)="onFocusIn($event)" (scroll)="onScroll()">
  <div #content class="stage-content diagram-svg" [style.transform]="transform()"></div>
</div>

<span id="stage-keys-help" class="visually-hidden">{{ 'diagram.stage.keysHelp' | translate }}</span>

<div class="canvas-tools" role="toolbar" [attr.aria-label]="'diagram.stage.toolbar' | translate">
  <button type="button" class="btn btn-icon" (click)="zoomIn()" [attr.aria-label]="'diagram.stage.zoomIn' | translate" [title]="'diagram.stage.zoomInTitle' | translate">+</button>
  <button type="button" class="btn btn-icon" (click)="zoomOut()" [attr.aria-label]="'diagram.stage.zoomOut' | translate" [title]="'diagram.stage.zoomOutTitle' | translate">−</button>
  <button type="button" class="btn btn-icon" (click)="fit()" [attr.aria-label]="'diagram.stage.fit' | translate" [title]="'diagram.stage.fit' | translate">⤢</button>
  <!-- O botão de desenho fica na 4ª posição, como no canvas; o zoom em % vem depois. -->
  <ng-content />
  <button type="button" class="btn btn-icon stage-actual" (click)="actualSize()" [attr.aria-label]="'diagram.stage.actualAria' | translate: { percent: percent() }" [title]="'diagram.stage.actualTitle' | translate">{{ percent() }}%</button>
</div>
